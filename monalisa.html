<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona Lisa</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f0e8;
            font-family: 'Georgia', serif;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 8px solid #3d2b1f;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #2c1810;
            margin-bottom: 10px;
        }
        p {
            color: #4a3b2e;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mona Lisa</h1>
        <img src="https://shop.musepaintbar.com/cdn/shop/files/MonaLisa.jpg?v=1707246495&width=823" alt="Mona Lisa oleh Leonardo da Vinci">
        <p>Lukisan terkenal oleh <strong>Leonardo da Vinci</strong> (sekitar 1503–1519), disimpan di Muzium Louvre, Paris.</p>
    </div>
</body>
</html>
